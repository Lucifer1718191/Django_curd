{% extends 'base.html' %}

{% block title %}Edit Profile - MyProject{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8">
        <div class="card shadow-sm border-0">
            <div class="card-body p-4">
                <h3 class="card-title mb-4">Edit Profile Information</h3>
                <form method="post" novalidate>
                    {% csrf_token %}
                    <h5 class="text-secondary border-bottom pb-2">User Details</h5>
                    {{ u_form|crispy }}
                    <h5 class="text-secondary border-bottom pb-2 mt-4">Profile Details</h5>
                    {{ p_form|crispy }}
                    <div class="d-flex gap-2 mt-4">
                        <button type="submit" class="btn btn-success">Save Changes</button>
                        <a href="{% url 'profile' %}" class="btn btn-secondary">Cancel</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
